---
layout: default
---

<header class="page-header">
  <h1 class="main-title">
    {{ page.title }}
    {% if page.subtitle %}
      <span class="sub-title">({{ page.subtitle }})</span>
    {% endif %}
  </h1>
</header>
<div class="{% if page.content_width == 'compact' %}inner-compact-content{% endif %}">
  {{ content }}
</div>
